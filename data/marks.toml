# The marks: the places every flight stands at, the same each time (plan 2.1). The game starts at the first.
#
# Each mark:
#   name     what it's called in the flight's report
#   at       where, north and east, in blocks
#   above    how far over a player's eye the camera stands (0: a player's own eye, 1.38 over the ground or the water)
#   facing   degrees from north toward east (east is 90)
#   pitch    degrees up from level (down is negative)
#   fog      whether fog is on (off: the clear day)
#   eyes     whose marks it is: "near" (2.3, the near eye) and "far" (2.2, the far eye)
#   changes  an event log whose placings are made as changes through the doorway before it's flown (optional)
#   scatter  random blocks round it, flown at each count of the dial (optional)
#   speed    on a flight, the camera flies straight ahead along its facing, level, at this many blocks a second, through
#            its settling and its measuring (optional; plan 2.2, step 4: the window round the eye, moving)
#   nod      on a flight, the camera pitched slowly up and down through this many degrees, a turn every 8 seconds
#            (optional; the Oracle's step 0: the horizon's worst case always met)
#
# The places are old's, as its flights stood at them (kept logs/dyno-1794448108.txt, kept logs/dyno-1794433359.txt).

[[mark]]
name = "on the ground at the spawn"
at = [0.5, 0.5]
above = 0.0
facing = 0.0
pitch = 0.0
fog = true
eyes = ["near"]

[[mark]]
name = "the mountain top on a clear day"
at = [-605.5, 78.5]
above = 0.0
facing = 172.61
pitch = -5.0
fog = false
eyes = ["near"]

# The plan's "plain's horizon" for the far eye: the open horizon over the plain, at eye height.
[[mark]]
name = "the bare plain"
at = [-3975.0, -1192.0]
above = 0.0
facing = 180.0
pitch = 0.4
fog = true
eyes = ["near", "far"]

# David's build of 2026-11-10 (build 108): 8 blocks off its north side, half way along it, looking at its middle.
[[mark]]
name = "the plain with David's build"
at = [-3975.0, -1192.0]
above = 0.0
facing = 180.0
pitch = 0.4
fog = true
eyes = ["near"]
changes = "kept logs/events-1794341728.log"

# The scatter dial: random whole blocks round the bare plain, flown at each count (the Oracle: "a dial from none to
# very many gives a curve of cost against clutter"; none is the bare plain itself).
[[mark]]
name = "the scatter"
at = [-3975.0, -1192.0]
above = 0.0
facing = 180.0
pitch = 0.4
fog = true
eyes = ["near"]
scatter = { counts = [1000, 10000, 100000], around = 64, high = 16, blocks = ["incus:stone", "incus:gabbro", "incus:sand"], seed = 1 }

[[mark]]
name = "high over the spawn"
at = [0.5, 0.5]
above = 400.0
facing = 0.0
pitch = -30.0
fog = true
eyes = ["far"]

# The far point of old's route over the sea, looking away from the middle.
[[mark]]
name = "low over the sea"
at = [-1905.7, -2137.7]
above = 20.0
facing = 228.28
pitch = -2.0
fog = true
eyes = ["far"]

# The window round the eye, moving (plan 2.2, step 4). A player's top speed, 200 blocks a second (the spec), from 30
# over the bare plain, south, level: 5 km in its 25 s. The bar: solid.
[[mark]]
name = "a player's run over the plain"
at = [-3975.0, -1192.0]
above = 30.0
facing = 180.0
pitch = -3.0
fog = true
eyes = ["far"]
speed = 200.0

# Fast, 2,000 blocks a second, from 20 km north of the spawn, south across the world: 50 km in its 25 s. 1,300 over
# its start (about 1,430 up), over the highest peaks [build 132: at 300 over it the run went into a mountain's side].
# No bar: where it creaks is reported.
[[mark]]
name = "fast across the world"
at = [20000.5, 0.5]
above = 1300.0
facing = 180.0
pitch = -8.0
fog = true
eyes = ["far"]
speed = 2000.0

# The horizon's worst case, always met (the Oracle's step 0): the plain and the sea, the camera pitched slowly through
# two rows of the 8 x 8 layer (16 screen rows of 1,600 at 100 degrees: about 1.4 degrees). Read at their 99th.
[[mark]]
name = "the plain, nodding"
at = [-3975.0, -1192.0]
above = 0.0
facing = 180.0
pitch = 0.4
fog = true
eyes = ["far"]
nod = 1.4

[[mark]]
name = "the sea, nodding"
at = [-1905.7, -2137.7]
above = 20.0
facing = 228.28
pitch = -2.0
fog = true
eyes = ["far"]
nod = 1.4
