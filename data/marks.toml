# The marks: the places every flight stands at, the same each time (plan 2.1). The game starts at the first.
#
# Each mark:
#   name     what it's called in the flight's report
#   at       where, north and east, in blocks
#   above    how far over a player's eye the camera stands (0: a player's own eye, 1.38 over the ground or the water)
#   facing   degrees from north toward east (east is 90)
#   pitch    degrees up from level (down is negative)
#   fog      whether fog is on (off: the clear day)
#   eyes     whose marks it is: "near" (2.3, the near eye) and "far" (2.2, the far eye)
#   changes  an event log whose placings are made as changes through the doorway before it's flown (optional)
#   scatter  random blocks round it, flown at each count of the dial (optional)
#
# The places are old's, as its flights stood at them (kept logs/dyno-1794448108.txt, kept logs/dyno-1794433359.txt).

[[mark]]
name = "on the ground at the spawn"
at = [0.5, 0.5]
above = 0.0
facing = 0.0
pitch = 0.0
fog = true
eyes = ["near"]

[[mark]]
name = "the mountain top on a clear day"
at = [-605.5, 78.5]
above = 0.0
facing = 172.61
pitch = -5.0
fog = false
eyes = ["near"]

# The plan's "plain's horizon" for the far eye: the open horizon over the plain, at eye height.
[[mark]]
name = "the bare plain"
at = [-3975.0, -1192.0]
above = 0.0
facing = 180.0
pitch = 0.4
fog = true
eyes = ["near", "far"]

# David's build of 2026-11-10 (build 108): 8 blocks off its north side, half way along it, looking at its middle.
[[mark]]
name = "the plain with David's build"
at = [-3975.0, -1192.0]
above = 0.0
facing = 180.0
pitch = 0.4
fog = true
eyes = ["near"]
changes = "kept logs/events-1794341728.log"

# The scatter dial: random whole blocks round the bare plain, flown at each count (the Oracle: "a dial from none to
# very many gives a curve of cost against clutter"; none is the bare plain itself).
[[mark]]
name = "the scatter"
at = [-3975.0, -1192.0]
above = 0.0
facing = 180.0
pitch = 0.4
fog = true
eyes = ["near"]
scatter = { counts = [1000, 10000, 100000], around = 64, high = 16, blocks = ["incus:stone", "incus:gabbro", "incus:sand"], seed = 1 }

[[mark]]
name = "high over the spawn"
at = [0.5, 0.5]
above = 400.0
facing = 0.0
pitch = -30.0
fog = true
eyes = ["far"]

# The far point of old's route over the sea, looking away from the middle.
[[mark]]
name = "low over the sea"
at = [-1905.7, -2137.7]
above = 20.0
facing = 228.28
pitch = -2.0
fog = true
eyes = ["far"]
