# Cargo.toml — the project's "shopping list".
# It names the game and lists the libraries ("crates") it is built from.
# Versions use "=" so they never change by surprise; upgrades are a deliberate decision.

[package]
name = "incus_artus"
version = "0.1.0"
edition = "2024"

# Old Incus Artus is its own workspace (since the pack, plan 2.1: it lives in `old/` under the new project's folder),
# so cargo never takes a Cargo.toml above it for its own.
[workspace]

# ── The dev switch ──────────────────────────────────────────────────────
# The developer tools are on unless switched off. A player's copy of the game is built with them
# off: `cargo build --release --no-default-features`. Off, there's no debug panel (F3), no Editor
# Suite (F2), no self-tests, soak test, screenshot key or temperature readout, and block files
# aren't reloaded as they're edited. (Their code is still built; they're just never switched on.)
[features]
default = ["dev"]
dev = []

[dependencies]
# Bevy's core only: the ECS (the World, its resources and messages, the scheduler that runs
# systems side by side), states, time, input types and logging. Its window, renderer, assets and the
# rest are left out (the regroup, docs/regroup.md): the window is winit's, the card is wgpu's, and
# drawing is ours.
bevy = { version = "=0.20.0", default-features = false, features = ["std", "multi_threaded", "async_executor", "bevy_log", "bevy_state", "bevy_color", "serialize", "keyboard", "mouse"] }
# The window and its input.
winit = "=0.30.13"
# The graphics card (DirectX 12 on Windows).
wgpu = "=30.0.1"
# Immediate-mode GUI used for the developer debug panel (not the game's real UI), drawn on the card
# by egui-wgpu, its input from winit by egui-winit.
egui = "=0.36.2"
egui-wgpu = { version = "=0.36.2", default-features = false }
egui-winit = { version = "=0.36.2", default-features = false, features = ["clipboard", "links"] }
# Waits on the card's set-up calls (a few at start).
pollster = "=0.4.0"
# Turns our settings into text and back ("serialising"), for presets and data files.
serde = { version = "=1.0.229", features = ["derive"] }
# The TOML text format (readable, allows comments) used for presets and data files.
toml = "=1.1.8"
# Writes PNG pictures (exporting fields from the World Gen suite). Bevy already uses this version.
png = "=0.18.1"
# Deflate, for a world exported as columns (world/export.rs). png already uses this version.
miniz_oxide = "=0.8.9"
# Reads glTF models' shapes (an object's size and what bodies bump into, data/objects.rs). Bevy
# already uses this version, with these features among its own.
gltf = { version = "=1.4.1", default-features = false, features = ["names", "utils"] }

# Windows' own calls: the frame's alarm, its claim on the PC's attention, and which processor core the
# frame runs on (src/runner/hardware.rs); DXC's validator loaded by its path (src/runner/mod.rs). wgpu already
# uses this version.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Media", "Win32_Security", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_LibraryLoader"] }

# ── Build speed settings ────────────────────────────────────────────────
# Bevy is huge and runs painfully slowly unoptimised. These settings optimise
# the libraries fully (they rarely change, so it's a one-time cost) while
# keeping our own code quick to recompile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Line tables in release builds, so crash reports say which file and line (see src/diagnostics.rs).
# Nothing changes at runtime; the files on disk are a little bigger. A player's copy can strip them.
[profile.release]
debug = "line-tables-only"
