# Cargo.toml: the new Incus Artus's "shopping list" (the rebuild, plan 2.1).
# It names the game and lists the libraries ("crates") it is built from. Versions use "=" so they never change by
# surprise; upgrades are a deliberate decision. They're old's versions, already on the laptop.
# Old Incus Artus is its own project in old/, with its own build folder (old/target): never shared with this one.

[package]
name = "incus_artus"
version = "0.1.0"
edition = "2024"

[dependencies]
# The window and its input.
winit = "=0.30.13"
# The graphics card (DirectX 12 on Windows). The editor and the debug panel are drawn by the game itself (src/gui/),
# egui gone since build 228.
wgpu = "=30.0.1"
# Waits on the card's set-up calls (a few at start).
pollster = "=0.4.0"
# Vectors: the camera's place and the way it looks.
glam = "=0.33.12"
# The messages the game and its libraries write to the session's log.
log = "=0.4.34"
# Reading the export behind the doorway (src/doorway.rs): its tiles are raw deflate, its world.toml is TOML.
miniz_oxide = "=0.8.9"
# Reading the blocks' pictures (src/textures.rs): PNG files. Old's version, already on the laptop.
png = "=0.18.1"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"

# Windows' own calls: DXC's validator loaded by its path (src/card.rs); the game's main memory and the machine's
# (src/memory.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

# ── Build speed settings ────────────────────────────────────────────────
# Libraries optimised fully (they rarely change, so it's a one-time cost), our own code quick to recompile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Line tables in release builds, so a crash says which file and line. Nothing changes at runtime.
[profile.release]
debug = "line-tables-only"
